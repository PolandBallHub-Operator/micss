<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HyperOS Lock Screen Settings</title>
  
  <!-- Google Fonts Material Symbols CDN -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <!-- MiCss CDN (HyperOS Web Components) -->
  <script src="https://cdn.jsdelivr.net/gh/PolandBallHub-Operator/micss@main/micsscdn.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f4f6;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
    }

    .app-viewport {
      width: 100%;
      max-width: 480px;
      height: 100%;
      padding: 32px 20px;
      box-sizing: border-box;
      overflow-y: auto;
      overscroll-behavior: none;
    }

    /* Page title according to HyperOS layout design */
    .page-header-title {
      font-size: 26px;
      font-weight: 500;
      color: #191919;
      margin: 0 0 28px 8px;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }

    /* Dark theme support setup */
    :root.dark-mode {
      --bg-base: #000000;
      --glass-bg: #1c1c1e;
      --text-main: #ffffff;
      --text-sub: #8e8e93;
    }
  </style>
</head>
<body>
  <div class="app-viewport">
    <!-- Title Section -->
    <h1 class="page-header-title">Items shown on the Lock screen after swiping down</h1>

    <!-- Grouped Settings List inside MiCss Card -->
    <dc-card>
      <dc-list>
        <!-- Item 1: Notification shade -->
        <dc-list-item>
          <span slot="title">Notification shade</span>
          <dc-toggle slot="action" id="toggle-notification" checked></dc-toggle>
        </dc-list-item>

        <!-- Item 2: Control centre -->
        <dc-list-item>
          <span slot="title">Control centre</span>
          <dc-toggle slot="action" id="toggle-control" checked></dc-toggle>
        </dc-list-item>

        <!-- Item 3: Smart device controls -->
        <dc-list-item>
          <span slot="title">Smart device controls</span>
          <dc-toggle slot="action" id="toggle-smart-device" checked></dc-toggle>
        </dc-list-item>

        <!-- Item 4: Use device controls (with description) -->
        <dc-list-item>
          <span slot="title">Use device controls</span>
          <span slot="description">Without unlocking your phone</span>
          <dc-toggle slot="action" id="toggle-use-device" checked></dc-toggle>
        </dc-list-item>
      </dc-list>
    </dc-card>

    <!-- Feedback Toast Notification -->
    <dc-toast id="toast"></dc-toast>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.DesignCatalog && typeof window.DesignCatalog.applyPtz === 'function') {
        window.DesignCatalog.applyPtz({
          accentColor: '#007AFF',
          cardRadius: 20
        });
      }

      const toast = document.querySelector('#toast');
      const toggles = document.querySelectorAll('dc-toggle');

      // Bind toggle change events to present responsive feedback
      toggles.forEach(toggle => {
        toggle.addEventListener('dc-change', (event) => {
          const listItem = toggle.closest('dc-list-item');
          const title = listItem ? listItem.querySelector('[slot="title"]')?.textContent : 'Setting';
          const isChecked = event.detail.checked;
          
          if (toast && typeof toast.show === 'function') {
            toast.show(`${title}: ${isChecked ? 'On' : 'Off'}`);
          }
        });
      });
    });
  </script>
</body>
</html>
